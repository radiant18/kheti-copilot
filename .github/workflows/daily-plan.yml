# Sends every subscribed farmer their plan at 5am IST.
#
# This lived in vercel.json as a Vercel Cron, which is tidier but counts against
# the account's cron-job allowance — and with several Vercel projects pointed at
# this one repo that allowance was exhausted, which blocks deployments before
# they even build. GitHub Actions has no such cap and the repo is already here.
#
# The endpoint is unchanged: this only pulls the trigger.
#
# Two repository secrets are required (Settings → Secrets and variables →
# Actions). Without them the job fails loudly rather than silently sending
# nothing:
#   KHETI_URL    the deployed origin, e.g. https://kheti-copilot.vercel.app
#   CRON_SECRET  the same value set in the Vercel project's environment
name: Daily farm plan

on:
  schedule:
    # GitHub Actions runs on UTC. 23:30 UTC is 05:00 IST the next morning.
    - cron: "30 23 * * *"
  # So the send can be tested without waiting for tomorrow.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the 5am send
        env:
          KHETI_URL: ${{ secrets.KHETI_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KHETI_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::KHETI_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi

          # --fail-with-body so a non-2xx is a red build with the reason visible,
          # rather than a green tick over a send that never happened.
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$KHETI_URL/api/cron/daily"
